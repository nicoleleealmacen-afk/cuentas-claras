name: Construir Cuentas Claras APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Descomprimir Cuentas Claras
        run: |
          mkdir -p proyecto
          unzip -o cuentas-claras-final-v2.zip -d proyecto

      - name: Encontrar proyecto Android
        run: |
          SETTINGS=$(find proyecto -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "No se encontró settings.gradle"
            find proyecto -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "Proyecto encontrado en: $(dirname "$SETTINGS")"
          echo "ANDROID_PROJECT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Construir APK
        run: |
          cd "$ANDROID_PROJECT"
          gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Cuentas-Claras-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
